[project]
name = "assert-backend"
version = "0.1.0"
description = "assert — verify assertions about a codebase, with reproducible evidence"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[tool.setuptools]
packages = ["assert_app"]

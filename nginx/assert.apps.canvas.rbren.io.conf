# Deployed copy lives at /etc/nginx/sites-available/assert.apps.canvas.rbren.io
# (certbot adds the TLS server block on first issuance).
server {
    server_name assert.apps.canvas.rbren.io;

    client_max_body_size 20m;

    # Allow ACME HTTP-01 challenge through without auth.
    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    # Python backend (FastAPI).
    location /api/ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:18400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Static React app.
    location / {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;

        root /root/git/assert/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/assert.apps.canvas.rbren.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/assert.apps.canvas.rbren.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = assert.apps.canvas.rbren.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name assert.apps.canvas.rbren.io;
    return 404; # managed by Certbot


}
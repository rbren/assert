# Deployed copy lives at /etc/nginx/snippets/assert-api.conf and is included
# from the canvas.rbren.io server block:
#
#     include /etc/nginx/snippets/assert-api.conf;
#
# The Canvas extension runs inside Canvas and has no origin of its own, so it
# reaches the assert backend at the Canvas origin under this prefix. Basic auth
# is the same one the rest of that host wears: the browser is already
# authenticated there, so the extension's requests carry the credentials.
location /api/assert/ {
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    proxy_pass http://127.0.0.1:18400/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
